# Untangle fork only: builds the solidtime image from this fork and publishes it to
# ghcr.io/untanglesl/solidtime for the Dokploy deployment (time.untangle.es).
# Based on build-public.yml (disabled on the fork). Kept in its own file so upstream
# merges never conflict with it.
on:
  push:
    branches:
      - feature/m365-integration
      - main
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  GHCR_REPO: ghcr.io/untanglesl/solidtime

name: Fork - Build image
jobs:
  build:
    if: github.repository == 'UntangleSL/solidtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: "Check out code"
        uses: actions/checkout@v7

      - name: "Get build"
        id: release-build
        run: echo "build=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Copy .env template for production"
        run: |
          cp .env.production .env
          rm .env.production .env.ci .env.example

      - name: "Add version and build to .env"
        run: |
          sed -i 's/APP_VERSION=0.0.0/APP_VERSION=m365-${{ steps.release-build.outputs.build }}/g' .env
          sed -i 's/APP_BUILD=0/APP_BUILD=${{ steps.release-build.outputs.build }}/g' .env

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql

      - name: "Install dependencies"
        run: composer install --no-dev --no-ansi --no-interaction --prefer-dist --ignore-platform-reqs --classmap-authoritative

      - name: "Use Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Build"
        run: npm run build

      - name: "Docker meta"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REPO }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          build-args: |
            DOCKER_FILES_BASE_PATH=docker/prod/
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
