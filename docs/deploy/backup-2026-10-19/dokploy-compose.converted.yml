version: "3.8"
services:
  app:
    image: solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    user: 1000:1000
    expose:
      - "8000"
    networks:
      - dokploy-network
      - default
    environment:
      CONTAINER_MODE: http
      APP_NAME: ${APP_NAME}
      VITE_APP_NAME: ${VITE_APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS}
      APP_ENABLE_REGISTRATION: ${APP_ENABLE_REGISTRATION}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      APP_KEY: ${APP_KEY}
      PASSPORT_PRIVATE_KEY: ${PASSPORT_PRIVATE_KEY}
      PASSPORT_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY}
      SUPER_ADMINS: ${SUPER_ADMINS}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      PUBLIC_FILESYSTEM_DISK: public
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app-storage:/var/www/html/storage
      - app-storage-files:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8000/health-check/up
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.untangle-solidtime-tq34sf-103-web.rule=Host(`time.untangle.es`)
      - traefik.http.routers.untangle-solidtime-tq34sf-103-web.entrypoints=web
      - traefik.http.services.untangle-solidtime-tq34sf-103-web.loadbalancer.server.port=8000
      - traefik.http.routers.untangle-solidtime-tq34sf-103-web.service=untangle-solidtime-tq34sf-103-web
      - traefik.http.routers.untangle-solidtime-tq34sf-103-web.middlewares=redirect-to-https@file
      - traefik.http.routers.untangle-solidtime-tq34sf-103-websecure.rule=Host(`time.untangle.es`)
      - traefik.http.routers.untangle-solidtime-tq34sf-103-websecure.entrypoints=websecure
      - traefik.http.services.untangle-solidtime-tq34sf-103-websecure.loadbalancer.server.port=8000
      - traefik.http.routers.untangle-solidtime-tq34sf-103-websecure.service=untangle-solidtime-tq34sf-103-websecure
      - traefik.http.routers.untangle-solidtime-tq34sf-103-websecure.tls.certresolver=default
      - traefik.enable=true
  scheduler:
    image: solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    user: 1000:1000
    networks:
      - dokploy-network
    environment:
      CONTAINER_MODE: scheduler
      APP_NAME: ${APP_NAME}
      VITE_APP_NAME: ${VITE_APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS}
      APP_ENABLE_REGISTRATION: ${APP_ENABLE_REGISTRATION}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      APP_KEY: ${APP_KEY}
      PASSPORT_PRIVATE_KEY: ${PASSPORT_PRIVATE_KEY}
      PASSPORT_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY}
      SUPER_ADMINS: ${SUPER_ADMINS}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      PUBLIC_FILESYSTEM_DISK: public
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app-storage:/var/www/html/storage
      - app-storage-files:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
  queue:
    image: solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    user: 1000:1000
    networks:
      - dokploy-network
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: php /var/www/html/artisan queue:work
      APP_NAME: ${APP_NAME}
      VITE_APP_NAME: ${VITE_APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS}
      APP_ENABLE_REGISTRATION: ${APP_ENABLE_REGISTRATION}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      APP_KEY: ${APP_KEY}
      PASSPORT_PRIVATE_KEY: ${PASSPORT_PRIVATE_KEY}
      PASSPORT_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY}
      SUPER_ADMINS: ${SUPER_ADMINS}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      PUBLIC_FILESYSTEM_DISK: public
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app-storage:/var/www/html/storage
      - app-storage-files:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:15
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - database-storage:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -q
        - -d
        - ${DB_DATABASE}
        - -U
        - ${DB_USERNAME}
      interval: 10s
      timeout: 5s
      retries: 5
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test:
        - CMD
        - curl
        - --silent
        - --fail
        - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  database-storage: null
  app-storage: null
  app-storage-files: null
  app-logs: null
networks:
  dokploy-network:
    external: true
